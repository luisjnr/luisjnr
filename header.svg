<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">Luis Junior — Backend Development</title>
  <desc id="desc">Dark GitHub profile header with a Luffy image above the title, blue backend accent, and Java/MySQL focus.</desc>

  <rect width="1600" height="520" rx="20" fill="#0D1117"/>

  <!-- Soft blue accents -->
  <circle cx="1460" cy="110" r="4" fill="#58A6FF" opacity="0.95"/>
  <circle cx="1510" cy="165" r="3" fill="#58A6FF" opacity="0.75"/>
  <circle cx="1430" cy="225" r="2.5" fill="#58A6FF" opacity="0.65"/>

  <!-- IMPORTANT:
       Keep luffy.gif in the same repository as this SVG.
       Change href below only if you move the GIF. -->
  <image href="luffy.gif"
         x="90" y="36"
         width="230" height="150"
         preserveAspectRatio="xMinYMin meet"/>

  <!-- Main title -->
  <text x="90" y="265"
        font-family="Arial, Helvetica, sans-serif"
        font-size="88"
        font-weight="700"
        fill="#F0F6FC">Luis Junior</text>

  <!-- Role -->
  <text x="94" y="330"
        font-family="Arial, Helvetica, sans-serif"
        font-size="42"
        font-weight="700"
        fill="#58A6FF">Backend Development</text>

  <!-- Student -->
  <text x="94" y="380"
        font-family="Arial, Helvetica, sans-serif"
        font-size="31"
        font-weight="400"
        fill="#C9D1D9">Information Systems Student</text>

  <!-- Current focus -->
  <text x="94" y="434"
        font-family="Arial, Helvetica, sans-serif"
        font-size="24"
        fill="#8B949E">Currently learning</text>

  <text x="290" y="434"
        font-family="Arial, Helvetica, sans-serif"
        font-size="24"
        font-weight="700"
        fill="#58A6FF">Java</text>

  <text x="350" y="434"
        font-family="Arial, Helvetica, sans-serif"
        font-size="24"
        fill="#8B949E">and</text>

  <text x="410" y="434"
        font-family="Arial, Helvetica, sans-serif"
        font-size="24"
        font-weight="700"
        fill="#58A6FF">MySQL</text>

  <text x="490" y="434"
        font-family="Arial, Helvetica, sans-serif"
        font-size="24"
        fill="#8B949E">, and enjoying the backend side of software development.</text>

  <!-- Bottom divider -->
  <line x1="94" y1="475" x2="1500" y2="475"
        stroke="#21262D"
        stroke-width="2"/>
</svg>
